name: ContextQA Mobile Test Plan

# ---------------------------------------------------------------------------
# Required repository secrets
#   CONTEXTQA_TOKEN - API token (token_...) from the plan's CI / CD tab
#   CQA_SERVER      - https://api.onprem-aws-01.contextqa.info
#
# No longer needed once this workflow works:
#   CQA_CI_TOKEN, CQA_ORIGIN, CQA_TENANT_UI
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: "Test plan id"
        required: true
        default: "41"
      release_tag:
        description: "Release tag holding the APK"
        required: true
        default: "v1"
      apk_name:
        description: "APK filename in the release"
        required: true
        default: "app-debug.apk"
      timeout_seconds:
        description: "How long to wait for the run to finish (seconds)"
        required: false
        default: "2400"

jobs:
  run-plan:
    runs-on: ubuntu-latest
    # Keep this above the Action's timeout (2400 seconds = 40 minutes by default).
    timeout-minutes: 60

    steps:
      - name: Download APK from private release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$APK_NAME" --dir .
          ls -lh "$APK_NAME"

      - name: Run ContextQA test plan
        uses: indivatools/contextqa-ci@v1
        with:
          plan-id: ${{ inputs.plan_id }}
          token: ${{ secrets.CONTEXTQA_TOKEN }}
          api-url: ${{ secrets.CQA_SERVER }}
          android-build: ${{ inputs.apk_name }}
          timeout: ${{ inputs.timeout_seconds }}
          # First test only: report the result without failing the build.
          # Remove this line once the run completes correctly.
          fail-on: never
